name: Test installed distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools and published dependencies
        run: python -m pip install ".[dev]"
      - name: Install optional typography support
        # Only macOS may fail here: DrawCV needs source-built PyICU there.
        # Windows and Linux resolve prebuilt wheels, so a failure is a real
        # regression and must turn the matrix red rather than be masked.
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: python -m pip install ".[typography]"
      - name: Require the font engine where wheels exist
        if: runner.os != 'macOS'
        run: python -c "import uharfbuzz, freetype, icu, regex, pythainlp"
      - name: Build source distribution and wheel
        run: python -m build --no-isolation --outdir output/release
      - name: Validate distribution contents and metadata
        run: python tools/check_release.py --dist-dir output/release
      - name: Install the built wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel, = pathlib.Path('output/release').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', str(wheel)], check=True)
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test installed package
        run: python -I -m pytest -q
      - name: Verify examples outside the checkout
        run: python -I tools/check_installed.py
      - name: Require the Thai and Arabic tests to actually run
        # Windows runners ship Tahoma, which covers both scripts, so the font
        # path must be exercised rather than silently skipped.
        if: runner.os == 'Windows'
        env:
          TUTORDRAW_REQUIRE_FONT: "1"
        run: python -m pytest tests/test_fonts.py -q
      - name: Test the browser player in Chromium
        # The player is JavaScript: one Python and one OS cover it. Required, so
        # a missing browser fails rather than skipping.
        if: runner.os == 'Linux' && matrix.python == '3.12'
        env:
          TUTORDRAW_REQUIRE_BROWSER: "1"
        run: |
          python -m pip install "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
          python -I -m pytest tests/test_player.py -q
      - name: Validate documentation and run README example
        run: python tools/check_docs.py
