[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutordraw"
version = "0.1.0a12"
description = "Author step-by-step visual tutorials using DrawCV drawings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nuh Yamin" }]
requires-python = ">=3.12"
dependencies = ["pydrawcv==0.11.0"]
keywords = ["tutorial", "drawing", "education", "diagram", "drawcv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
# Shaped scripts (Thai, Arabic) need DrawCV's font engine. Everything else,
# including Latin, Greek, Cyrillic, CJK and symbols, works without this.
typography = ["pydrawcv[typography]==0.11.0"]
# Deliberately excludes the typography extra: on macOS DrawCV requires real
# PyICU, which has no wheels and builds against Homebrew ICU. Install it
# separately when you need Thai or Arabic.
# Equations from LaTeX (tutordraw.kits.Equation). ziamath is pure Python, MIT,
# about 3 MB with its font and latex2mathml; tested with 0.13.
math = ["ziamath>=0.13,<0.14"]
dev = ["ziamath>=0.13,<0.14", "pytest>=8", "build>=1", "setuptools>=77", "wheel", "twine>=6", "jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/nuhyamin1/tutordraw"
Issues = "https://github.com/nuhyamin1/tutordraw/issues"
Documentation = "https://github.com/nuhyamin1/tutordraw#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tutordraw = ["lesson-v1.schema.json", "lesson-v2.schema.json", "lesson-v3.schema.json", "lesson-v4.schema.json", "lesson-v5.schema.json", "lesson-v6.schema.json", "lesson-v7.schema.json", "lesson-v8.schema.json", "lesson-v9.schema.json", "player.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
