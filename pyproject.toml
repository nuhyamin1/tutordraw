[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutordraw"
version = "0.1.0a6"
description = "Author step-by-step visual tutorials using DrawCV drawings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nuh Yamin" }]
requires-python = ">=3.12"
dependencies = ["pydrawcv==0.10.0.post1"]
keywords = ["tutorial", "drawing", "education", "diagram", "drawcv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "setuptools>=77", "wheel", "twine>=6", "jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/nuhyamin1/tutordraw"
Issues = "https://github.com/nuhyamin1/tutordraw/issues"
Documentation = "https://github.com/nuhyamin1/tutordraw#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tutordraw = ["lesson-v1.schema.json", "lesson-v2.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
